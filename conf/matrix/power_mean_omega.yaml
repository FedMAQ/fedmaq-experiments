# Stage 1b of the re-cut formulation design: omega follow-up at the selected p.
# Sweeps omega in {0.25, 0.75} (2 net-new variants x 2 skews x 3 seeds = 12 cells).
# The omega=0.5 cells at the selected p are reused from Stage 1a (power_mean_design).
phase: explore
stage: stage_1b
protocol_stage: stage_1b
split: val
ledger: scientific
experiment_group: power_mean_omega
dataset: cifar10
model: mobilenetv2
total_rounds: 100
client_gpus: 0.5
seeds: [0, 42, 123]
heterogeneities:
  - dirichlet_alpha_0.1
  - dirichlet_alpha_1.0

runs:
  - alg: power_mean
    label: power-mean-omega-0.25
    variant: omega0.25
    overrides:
      # PRE-DISPATCH PLACEHOLDER, fail-closed. `???` composes to OmegaConf MISSING, so
      # reading `algorithm.p` raises MissingMandatoryValue until the Stage-1a verdict is
      # written in. Do not substitute a plausible default the way the freeze-confirm
      # matrix does: `_power_mean_base.yaml` defaults `p: 0`, which is itself a Stage-1a
      # candidate, so a forgotten edit would dispatch all 12 cells at the wrong
      # compensation degree and they would be indistinguishable on disk -- the identity
      # key does not encode `p`. ADR-0021 D2; issue #96.
      - algorithm.p=???
      - algorithm.omega=0.25
  - alg: power_mean
    label: power-mean-omega-0.75
    variant: omega0.75
    overrides:
      # PRE-DISPATCH PLACEHOLDER, fail-closed -- see the omega=0.25 run above.
      - algorithm.p=???
      - algorithm.omega=0.75
