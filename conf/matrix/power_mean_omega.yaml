# Stage 1b of the re-cut formulation design: omega follow-up at the selected p.
# Sweeps omega in {0.25, 0.75} (2 net-new variants x 2 skews x 3 seeds = 12 cells).
# The omega=0.5 cells at the selected p are reused from Stage 1a (power_mean_design).
#
# WRITING IN THE STAGE-1A VERDICT also re-registers this matrix. Replacing `???` changes
# this file's resolved content, so `matrix_contracts.power_mean_omega.sha256` in
# conf/protocol/replacement-v1.yaml no longer matches and dispatch raises "diverges from
# the replacement protocol". That is a re-registration debt, not tampering: update the
# contract in the same commit as the write-in. Take the correct digest from the `actual=`
# sha256 quoted in the raise; it is `protocol._sha256` over this file's resolved container.
# Until then the planner refuses this matrix on the placeholder, ahead of the hash check.
phase: explore
stage: stage_1b
protocol_stage: stage_1b
split: val
ledger: scientific
experiment_group: power_mean_omega
dataset: cifar10
model: mobilenetv2
total_rounds: 100
client_gpus: 0.5
seeds: [0, 42, 123]
heterogeneities:
  - dirichlet_alpha_0.1
  - dirichlet_alpha_1.0

runs:
  - alg: power_mean
    label: power-mean-omega-0.25
    variant: omega0.25
    overrides:
      # `p=0.5` is `selected_p` from Stage 1a (ADR-0024 D1), written in explicitly rather
      # than left to `_power_mean_base.yaml`'s `p: 0` default -- that default is itself a
      # Stage-1a candidate, so a forgotten write-in would have dispatched all 12 cells at
      # the wrong compensation degree, indistinguishable on disk, since the identity key
      # does not encode `p`. This was `???` (fail-closed placeholder) until the write-in;
      # see `scripts/matrix_planner.py:unresolved_selection` for that mechanism.
      # ADR-0021 D2; ADR-0024 D1; ADR-0026 (the reused omega=0.5 cell below is disclosed
      # as winner's-curse biased, not redrawn); issue #96.
      - algorithm.p=0.5
      - algorithm.omega=0.25
  - alg: power_mean
    label: power-mean-omega-0.75
    variant: omega0.75
    overrides:
      # `p=0.5` -- see the omega=0.25 run above.
      - algorithm.p=0.5
      - algorithm.omega=0.75
