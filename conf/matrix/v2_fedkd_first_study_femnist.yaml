# FedKD first-study rerun (ADR-0028, item 6): the fixed FedKD on the first-study cells
# the preflight did not cover. That ADR, not this header, owns the stage and its rules.
#
# The first-study grid is five conditions on seeds 0, 42 and 123. v2_fedkd_preflight ran
# CIFAR-10 at alpha=0.1; the three v2_fedkd_first_study matrices run the other twelve
# cells. The only change from the first-study FedKD arm is
# +algorithm.detach_kl_targets=true, a disclosed adaptation. The results form a
# labelled post-hoc FedKD row and select nothing.
#
# Dispatch waits for the preflight to pass. Phase v2_kd and experiment_group
# v2_fedkd_first_study keep these outputs apart from every other tree.
# conf/protocol/replacement-v1.yaml pins this file's resolved hash; any edit voids the
# registration.

phase: v2_kd
stage: v2_fedkd_first_study
protocol_stage: v2_fedkd_first_study
split: test
ledger: scientific
experiment_group: v2_fedkd_first_study
dataset: femnist
model: simplecnn
experiment: femnist
total_rounds: 100
client_gpus: 0.5
seeds: [0, 42, 123]
heterogeneities:
  - femnist

runs:
  - alg: fedkd
    label: fedkd_detached
    overrides:
      - +algorithm.detach_kl_targets=true
