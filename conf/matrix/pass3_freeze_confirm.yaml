# Exploration-phase PRE-FREEZE CONFIRMATION, manuscript §4.3.1.
#
# STATUS: retained pre-registration record. This stage was skipped as degenerate
# (ADR-0008); it does not run. Everything below is pre-registered design text, not
# live procedure. Each branch is marked with whether it fired.
#
# Stage 3 of 3, and the last thing that runs before the freeze. §4.3.1: "Exploration
# ends by pre-registering a frozen configuration, preceded by a final confirmation
# of the surviving mechanism set against the unrefined configuration at three seeds
# and the full R = 100 round budget, so that no mechanism enters the freeze having
# been judged only on a truncated horizon."
#
# Stages 1 and 2 both run at R=50. This stage exists because a mechanism can help
# early and stop helping (or start hurting) by round 100 — an EMA in particular
# trades early stability for late-phase lag. Two arms only, at the full budget:
# the surviving set against the unrefined reference.
#
# THIS MATRIX DID NOT RUN, AND WILL NOT. Exploration executed 2026-08-02 and the
# noise-margin verdict was an empty surviving set, so ADR-0008 records the
# pre-registered empty-freeze branch executing directly and this Stage 3
# confirmation being skipped as degenerate: with nothing in the surviving set both
# arms below are config-identical to unrefined, and the comparison has nothing to
# compare.
#
# The file is retained under ADR-0010's rule against deleting a pre-registered
# branch that has been ruled out.
#
# The `fedmaq-surviving-set` overrides below are placeholders that were never
# resolved. They set all three mechanisms true, which contradicts fedmaq.yaml's
# "Decision 79/80 ... empty surviving set ... Do not flip these"; `pending_selection`
# keeps the dispatch planner refusing this matrix by name, so that contradiction
# cannot reach an allocation.
#
# AFTER RUNNING -- BRANCH NOT TAKEN. This stage never ran, so none of the steps
# below were performed and none should be. Retained as pre-registered text only.
# If the surviving set still clears the margin at R=100, write
# those values into conf/algorithm/fedmaq.yaml -- and ONLY there. The §4.3.7
# ablation arms inherit that file through their defaults list and restate only
# their own removal, so the freeze reaches all of them from one edit; there is no
# longer a set of parallel copies to keep in step. Then:
#   1. uv run python scripts/dump_frozen_configs.py   (refresh docs/freeze/)
#   2. uv run python -m pytest tests/test_config_and_dispatch.py
#   3. commit and tag.
# Step 1 is not optional bookkeeping: the arms are no longer self-describing, and
# docs/freeze/resolved_configs.yaml is what makes the tagged state readable as
# chapter 6 §6.2's recoverable frozen configuration. `--check` fails on a stale one.
#
# IF IT DOES NOT CLEAR -- THIS IS THE BRANCH THAT FIRED, at the Stage 2 factorial
# rather than here; ADR-0008 records it executing directly and this stage being
# skipped as degenerate. Pre-registered here, before the runs existed, because a
# failure branch invented after seeing the numbers is not a failure branch. The
# surviving set collapses to EMPTY: all three refinements ship off, fedmaq.yaml
# freezes unrefined, and Ablation Configuration 8 drops from conf/matrix/
# ablation.yaml (nothing left to remove) along with the chapter 6 contribution
# bullet that rests on its contrast. There are no subset retries at R=100 and no
# hyperparameter tuning to rescue a mechanism. Re-testing the subsets of a set
# that failed is exactly the search this two-stage design exists to prevent, and
# it would spend the confirmation stage's independence -- the thing that controls
# the factorial's seven-way multiplicity -- to buy back a mechanism the data did
# not support.
#
# WHY THE UNREFINED ARM RUNS FIVE SEEDS. Same reason as the factorial's reference
# cell: this arm's spread is the sigma for this stage's margin, and this stage is
# the single gate on the freeze. Two extra runs at R=100 (~70 min) narrow the 95%
# interval on sigma from roughly twelvefold to roughly fivefold. The surviving-set
# arm stays at three: it supplies a mean, not the threshold.
#
# Not counted among the 177 confirmatory runs.
phase: explore
stage: historical
protocol_stage: historical
split: val
ledger: historical
experiment_group: pass3_freeze_confirm
dataset: cifar10
model: mobilenetv2
total_rounds: 100
client_gpus: 0.5
seeds: [0, 42, 123]
heterogeneities:
  - dirichlet_alpha_0.3

# Both arms dispatch `alg: fedmaq` and differ only by override, so each needs its
# own `variant` to key a distinct output directory -- see scripts/common.py:
# get_canonical_output_dir. tests/test_config_and_dispatch.py asserts no matrix collides.
runs:
  - alg: fedmaq
    label: fedmaq-unrefined
    variant: unrefined
    # Defines this stage's sigma; deepened for the same reason as the factorial's
    # reference cell. Must stay a superset of the matrix-level seeds.
    seeds: [0, 42, 123, 7, 21]
    overrides:
      - algorithm.soft_voting=false
      - algorithm.ema_student=false
      - algorithm.grad_norm_ema=false
  - alg: fedmaq
    label: fedmaq-surviving-set
    variant: surviving-set
    # Set from exploration_margin.json before dispatch; clearing this list is the act
    # that records the verdict. These keys cannot use power_mean_omega's `???`
    # sentinel: the consumer reads them as `alg_cfg.get(key, False)`, where the string
    # '???' is truthy, so the sentinel would turn every mechanism ON instead of off.
    pending_selection: [soft_voting, ema_student, grad_norm_ema]
    overrides:
      - algorithm.soft_voting=true
      - algorithm.ema_student=true
      - algorithm.grad_norm_ema=true
