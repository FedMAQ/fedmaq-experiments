# Ablation study, manuscript §4.3.7. Leave-one-out: each arm is full FedMAQ with
# exactly one component removed. 6 net-new arms x 2 alpha x 3 seeds = 36 runs.
#
# CONFIGURATION 8 DROPPED (Decision 79/80): pass2_factorial's surviving refinement
# set came back empty, so fedmaq.yaml froze unrefined (soft_voting/ema_student/
# grad_norm_ema all false). Configuration 8 removed "the frozen refinement layer";
# an empty layer has nothing left to remove, so the arm would duplicate
# Configuration 7 and report pure noise as a component's contribution.
# tests/test_simulation.py::test_configuration_8_exists_only_while_there_is_a_layer_to_remove
# enforces this — it will fail again if a future freeze re-enables any refinement
# and this arm is not restored.
#
# WHY CONFIGURATION 7 IS LISTED HERE AND NOT INHERITED
#
# It used to be inherited from conf/matrix/benchmark_grid.yaml. That grid runs
# FedMAQ with the §4.3 post-processing pipeline (error feedback, difference
# coding, lossless zlib); no ablation arm does. Inheriting it would have made
# every arm two removals from its own reference -- its awareness signal plus the
# coding pipeline -- which is the exact confound the leave-one-out rebuild
# existed to remove, reintroduced through the inheritance rather than through any
# arm's config.
#
# The pipeline compresses payloads far harder than any single awareness signal
# shifts them, so the damage would have landed almost entirely on the
# communication axis, which is the axis the ablation's claims rest on.
#
# So Configuration 7 runs here, without the pipeline, as the study's own parity
# anchor. Six extra runs; the grid is 183 rather than 177. NOTHING IN THIS FILE
# MAY SET algorithm.post_process=true -- tests/test_simulation.py enforces it.
#
# Configuration 1 (uncompressed FedAvg) is still inherited from the benchmark
# grid: it has no compression stage for the pipeline to attach to, so its
# telemetry is identical in either regime.
#
# Configuration 4 (fedmaq_no_state) WAS the pre-registered fallback arm, anchored
# against the formulation study's own Formulation 1 runs. Decision 84 retired that
# exception: the study froze Formulation 2, which can express state-awareness
# removal in place (gamma1 = 0), so the arm is nested and anchors to Configuration
# 7 like every other. See conf/algorithm/fedmaq_no_state.yaml.
#
# THE PRE-DISPATCH CONTINGENCY IN THIS HEADER HAS FIRED. It used to read: "the
# arms are pinned to formulation 3 pending the formulation study. If Formulation 1
# or 2 wins, fedmaq_no_data's removal becomes gamma2=0 and fedmaq_no_state stops
# being the fallback arm." Formulation 2 won (Decision 84) and both changes were
# made, in conf/algorithm/ and in ABLATION_ARM_DIFFS. The arms now differ from
# full FedMAQ in exactly one key each, symmetrically, with no renormalization —
# recorded here because it is a pre-registered branch executing, not a repair.
#
# The reserved 6-run refinement recheck (formulation_study.yaml, "THE RESERVED
# RECHECK") fires on any non-Formulation-3 freeze but is DEGENERATE here: it pits
# "surviving layer" against "unrefined", and Decision 79/80 froze the surviving
# layer EMPTY, so both arms are byte-identical. It is a veto, never a second
# search, so it cannot re-populate the layer these arms inherit. This ablation is
# therefore not gated on it and cannot be invalidated by it.
phase: formal
experiment_group: ablation
dataset: cifar10
model: mobilenetv2
total_rounds: 100
client_gpus: 0.5
seeds: [0, 42, 123]
heterogeneities:
  - dirichlet_alpha_0.1
  - dirichlet_alpha_1.0

runs:
  # Configuration 2: Tier-1 memory ceiling lifted (memory-blind condition).
  - alg: fedmaq_no_resource
    label: config2-no-resource
  # Configuration 3: data-richness term removed (gamma2 = 0). DynFed-style
  # reference point.
  - alg: fedmaq_no_data
    label: config3-no-data
  # Configuration 4: state awareness removed (gamma1 = 0). Nested since
  # Decision 84; anchors to Configuration 7.
  - alg: fedmaq_no_state
    label: config4-no-state
  # Configuration 5: server-side distillation removed.
  - alg: fedmaq_no_kd
    label: config5-no-kd
  # Configuration 6: quantization removed. The post-processing pipeline is
  # inapplicable here rather than merely off -- it acts on quantized codes and
  # this arm produces none.
  - alg: fedavg_kd
    label: config6-no-quantization
  # Configuration 7: full FedMAQ, pipeline-free. The study's parity anchor.
  - alg: fedmaq
    label: config7-full-fedmaq
  # Configuration 8 (fedmaq_no_refinements) dropped — see file header,
  # Decision 79/80. Empty frozen refinement layer, nothing left to remove.
