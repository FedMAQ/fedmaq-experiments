# Primary confirmatory benchmark grid, CIFAR-10 half (100 rounds, 3 seeds). 42 runs.
#
# One of three files that together make up §4.5's 105 primary-grid runs:
# this one (CIFAR-10, 42), benchmark_grid_cifar100.yaml (42), and
# benchmark_grid_femnist.yaml (21). All three declare the same
# `experiment_group: benchmark_grid` so scripts/analysis.py reads them as one
# grid. Dispatch all three; running only this one delivers 42 of 105.
#
# FedMAQ runs here with the §4.3 post-processing pipeline (error feedback +
# difference coding + lossless zlib). The flag lives in the matrix and not in
# conf/algorithm/fedmaq.yaml because that same file is the formulation study's
# config and Ablation Configuration 7, neither of which may carry the pipeline.
# Pipeline on: the three primary-grid files and uniform_memory_control.yaml,
# whose comparison partner is FedMAQ's rows here. Pipeline off: ablation.yaml and
# formulation_study.yaml. See the header of fedmaq.yaml and of each matrix.
#
# THE `fedavg` ROW DOES NOT WAIT FOR THE REST OF THIS FILE. Its six CIFAR-10 runs
# define the formulation study's accuracy floor (90% of uncompressed FedAvg at the
# same skew, §4.3.6), and that study's verdict is what freezes the FedMAQ config
# the other 36 rows here run. Dispatched in file order the dependency is circular,
# so Stage 1c pulls the row forward:
#
#     run_matrix.py --matrix benchmark_grid --only fedavg
#
# then Stage 4 runs this file whole with --skip_completed, which passes over them.
# Same group, same overrides, same directories -- six of these 42 runs, not six
# more. They are the only confirmatory runs preceding the §4.3.1 tag, admissible
# because FedAvg carries none of the three artifacts that tag locks. Decision 71
# and docs/RUNBOOK.md Stage 1c.
phase: formal
experiment_group: benchmark_grid
dataset: cifar10
model: mobilenetv2
total_rounds: 100
client_gpus: 0.5
seeds: [0, 42, 123]
heterogeneities:
  - dirichlet_alpha_0.1
  - dirichlet_alpha_1.0

runs:
  - alg: fedavg
    label: fedavg
  - alg: fedprox
    label: fedprox
  - alg: fedpaq
    label: fedpaq
  - alg: dadaquant
    label: dadaquant
  - alg: feddistill
    label: feddistill
  - alg: fedkd
    label: fedkd
  - alg: fedmaq
    label: fedmaq
    overrides:
      - algorithm.post_process=true
