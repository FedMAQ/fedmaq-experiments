# Matrix specification for formal confirmatory benchmark grid (100 rounds, 3 seeds)
#
# This is the ONLY stage that runs FedMAQ with the §4.3 post-processing pipeline
# (error feedback + difference coding + lossless zlib). The flag lives here and
# not in conf/algorithm/fedmaq.yaml because that same file is the formulation
# study's config and Ablation Configuration 7, neither of which may carry the
# pipeline. See the header of fedmaq.yaml and conf/matrix/ablation.yaml.
phase: formal
experiment_group: benchmark_grid
dataset: cifar10
model: mobilenetv2
total_rounds: 100
client_gpus: 1.0
seeds: [0, 42, 123]
heterogeneities:
  - dirichlet_alpha_0.1
  - dirichlet_alpha_1.0

runs:
  - alg: fedavg
    label: fedavg
  - alg: fedprox
    label: fedprox
  - alg: fedpaq
    label: fedpaq
  - alg: dadaquant
    label: dadaquant
  - alg: feddistill
    label: feddistill
  - alg: fedkd
    label: fedkd
  - alg: fedmaq
    label: fedmaq
    overrides:
      - algorithm.post_process=true
