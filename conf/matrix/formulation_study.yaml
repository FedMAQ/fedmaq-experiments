# Formulation study, manuscript §4.3.6. The five candidate multi-adaptive
# quantization formulations on CIFAR-10 at both skews, three seeds: 30 runs.
#
# WHY THIS IS A MATRIX AND NOT A RAW --multirun
#
# It used to be a hand-typed command in a conf/config.yaml comment, which put its
# runs in a date-keyed multirun/ tree with no experiment_group. That is a problem
# beyond tidiness: the Formulation 1 cell of this study is Ablation
# Configuration 4's parity anchor under §4.3.7's pre-registered fallback rule, and
# an anchor that analysis cannot address is not an anchor.
#
# Every run here is `algorithm=fedmaq` differing only by an override, so each
# carries a `variant` — the canonical output path keys on the algorithm, not the
# run label, and without the variant all five formulations would write into one
# directory and only the last would survive.
#
# NO RUN HERE MAY SET algorithm.post_process=true. §4.3.6 withholds the pipeline
# so the formulations are judged on their mathematical merit alone, and §4.3.7
# depends on that: Configuration 4's anchor has to sit in the same pipeline-free
# regime as the ablation arms it is compared beside. tests/test_simulation.py
# enforces it.
#
# BEFORE DISPATCH: the exploration phase must have completed (§4.5). These runs
# carry its surviving refinement layer, and Configuration 4's anchor only anchors
# if it carries the same layer as the arm.
#
# ALSO BEFORE DISPATCH: the benchmark grid's six CIFAR-10 `fedavg` rows (Stage 1c,
# `run_matrix.py --matrix benchmark_grid --only fedavg`). The winner rule here is
# not scale-free -- every candidate is judged against a floor of 90% of
# uncompressed FedAvg's final accuracy at its own skew, and analysis.py raises
# rather than guessing if those runs are absent. They are grid rows dispatched
# early, not extra runs; see benchmark_grid.yaml's header and Decision 71.
#
# The five arms below are the ONLY formulation candidates. scripts/analysis.py
# scopes them by this file's `experiment_group`, because the exploration
# factorial, the R=100 confirmation, the conditional recheck and the grid all
# dispatch `algorithm=fedmaq` and fedmaq.yaml carries `formulation: 3` -- so on
# algorithm and formulation alone they are indistinguishable from a candidate
# here. The grid's rows are the dangerous ones: they run with post_process=true,
# and pooling them into Formulation 3's cell would credit the incumbent formula
# with the payload savings this study exists to withhold.
#
# SELECTION IS SEQUENTIAL, AND THE CIRCULARITY IS BOUNDED
#
# The refinements were selected with the formulation held at 3, and the
# formulation is selected here with the refinement layer held at whatever
# survived. That is coordinate-wise, not joint: a refinement that helps under
# Formulation 3 and hurts under the winner would not be caught. A joint search
# over 5 formulations x 8 refinement cells x 3 seeds is 120 runs and is not
# affordable; the sequential order is disclosed in §4.3.6 as a limitation rather
# than papered over. soft_voting is the exposed verdict -- it reweights teacher
# logits by quantization level, so it is the one mechanism whose value plausibly
# depends on which formulation assigns those levels.
#
# THE RESERVED RECHECK, AND WHAT A FLIP MEANS -- pre-registered before the runs
# exist. If Formulation 3 wins, nothing is spent and the layer stands as frozen.
# If another formulation wins, a 6-run recheck (surviving layer vs. unrefined,
# 3 seeds, under the winning formulation, at the held-out alpha = 0.3) is spent
# to re-test the layer where it now has to live.
#
# If that recheck no longer clears the margin, soft_voting leaves the frozen set,
# conf/algorithm/fedmaq.yaml and every §4.3.7 arm are rewritten to the reduced
# layer, and Ablation Configuration 8 shrinks to whatever remains (dropping
# entirely if nothing does). The factorial is NOT re-run under the new
# formulation, and no other mechanism is reconsidered on the strength of it. The
# recheck is a veto on the layer it was given, not a second search -- re-opening
# the factorial here would spend the held-out skew's independence a second time
# and turn a bounded sequential design into an unbounded one.
#
# PHASE. These runs are `explore`, not `formal`, and are not among the 177.
# chapter_4.tex:161 makes this study "the pre-registered culmination of the
# exploration phase's search", whose verdict is written into the frozen
# configuration and tagged -- so it necessarily precedes the freeze rather than
# sitting inside the confirmatory grid it configures. Its held-out axis is
# dataset, not skew (chapter_4.tex:155): the formulation is chosen on CIFAR-10
# and tested by CIFAR-100 and FEMNIST in the main grid.
phase: explore
experiment_group: formulation_study
dataset: cifar10
model: mobilenetv2
total_rounds: 100
client_gpus: 0.5
seeds: [0, 42, 123]
heterogeneities:
  - dirichlet_alpha_0.1
  - dirichlet_alpha_1.0

runs:
  # Formulation 0: Resource-Only Hard Cap. No Tier-2 soft target.
  - alg: fedmaq
    label: formulation0-resource-only
    variant: f0
    overrides:
      - algorithm.formulation=0
  # Formulation 1: Normalized Linear Weighted Sum (omega1 = omega2 = 0.5).
  # This cell is Ablation Configuration 4's parity anchor.
  - alg: fedmaq
    label: formulation1-linear-sum
    variant: f1
    overrides:
      - algorithm.formulation=1
  # Formulation 2: Normalized Multiplicative Scaling (omega1 = omega2 = 0.5).
  - alg: fedmaq
    label: formulation2-multiplicative
    variant: f2
    overrides:
      - algorithm.formulation=2
  # Formulation 3: Gradient-Primary, Data-Modulated (kappa = 1.0). The current
  # implementation default, pending this study's verdict.
  - alg: fedmaq
    label: formulation3-gradient-primary
    variant: f3
    overrides:
      - algorithm.formulation=3
  # Formulation 4: Threshold-Based Staged Rule (tau_g = tau_n = 0.5).
  - alg: fedmaq
    label: formulation4-threshold
    variant: f4
    overrides:
      - algorithm.formulation=4
