# Adviser-requested widened matched-tuning stage, manuscript §4.3.2.
#
# This is the replacement Stage-A evidence stage. The historical 55-run
# baseline_tuning matrix and its freeze manifest remain unchanged. Each
# algorithm with a tunable knob gets five registered validation seeds per arm:
# 29 arms x 5 seeds = 145 cells.
# FedAvg remains absent because it is the uncompressed control. FedMAQ uses q_max;
# c_unit=512 remains fixed by ADR-0002.
phase: explore
stage: matched_tuning
protocol_stage: matched_tuning
split: val
ledger: scientific
experiment_group: baseline_tuning_wide
dataset: cifar10
model: mobilenetv2
total_rounds: 100
client_gpus: 0.5
seeds: [0, 42, 123, 7, 21]
heterogeneities:
  - dirichlet_alpha_0.3
identity:
  alpha: 0.3
  fedmaq_formulation: 2

# Reporting metadata consumed by scripts/analysis.py. Keeping the value ladder
# beside the dispatch matrix makes Hydra/configuration the canonical home for all
# tunable constants while the report remains reconstructable from this file.
tuning:
  fedprox:
    knob: mu
    paper_default_variant: mu1p0
    adopted_variant: mu0p01
    values: {mu0p001: 0.001, mu0p01: 0.01, mu0p1: 0.1, mu1p0: 1.0, mu10p0: 10.0}
  fedpaq:
    knob: q
    paper_default_variant: null
    paper_default_note: FedPAQ reports level counts rather than a bit-width default; q8 is the shipped reference adopted from Wu et al.
    adopted_variant: q8
    values: {q2: 2, q4: 4, q8: 8, q16: 16, q32: 32}
  dadaquant:
    knob: phi
    paper_default_variant: phi10
    adopted_variant: phi10
    values: {phi1: 1, phi5: 5, phi10: 10, phi20: 20, phi40: 40}
  feddistill:
    knob: reg_alpha
    paper_default_variant: a1p0
    adopted_variant: a0p5
    values: {a0p1: 0.1, a0p5: 0.5, a1p0: 1.0, a2p0: 2.0, a4p0: 4.0}
  fedkd:
    knob: tmax
    paper_default_variant: null
    paper_default_note: The FedKD source names the schedule endpoints but does not report numeric defaults; t0p95 is the shipped reference.
    adopted_variant: t0p95
    values: {t0p75: 0.75, t0p85: 0.85, t0p95: 0.95, t0p99: 0.99, t1p0: 1.0}
  fedmaq:
    knob: q_max
    paper_default_variant: null
    paper_default_note: q_max has no source-paper default; qmax16 is the shipped reference.
    adopted_variant: qmax16
    values: {qmax4: 4, qmax6: 6, qmax8: 8, qmax16: 16}

runs:
  - alg: fedprox
    label: fedprox-mu1.0-ref
    variant: mu1p0
    overrides: [algorithm.mu=1.0]
  - alg: fedprox
    label: fedprox-mu0.001
    variant: mu0p001
    overrides: [algorithm.mu=0.001]
  - alg: fedprox
    label: fedprox-mu0.01
    variant: mu0p01
    overrides: [algorithm.mu=0.01]
  - alg: fedprox
    label: fedprox-mu0.1
    variant: mu0p1
    overrides: [algorithm.mu=0.1]
  - alg: fedprox
    label: fedprox-mu10.0
    variant: mu10p0
    overrides: [algorithm.mu=10.0]

  - alg: fedpaq
    label: fedpaq-q8-ref
    variant: q8
    overrides: [algorithm.q=8]
  - alg: fedpaq
    label: fedpaq-q2
    variant: q2
    overrides: [algorithm.q=2]
  - alg: fedpaq
    label: fedpaq-q4
    variant: q4
    overrides: [algorithm.q=4]
  - alg: fedpaq
    label: fedpaq-q16
    variant: q16
    overrides: [algorithm.q=16]
  - alg: fedpaq
    label: fedpaq-q32
    variant: q32
    overrides: [algorithm.q=32]

  - alg: dadaquant
    label: dadaquant-phi10-ref
    variant: phi10
    overrides: [algorithm.phi=10]
  - alg: dadaquant
    label: dadaquant-phi1
    variant: phi1
    overrides: [algorithm.phi=1]
  - alg: dadaquant
    label: dadaquant-phi5
    variant: phi5
    overrides: [algorithm.phi=5]
  - alg: dadaquant
    label: dadaquant-phi20
    variant: phi20
    overrides: [algorithm.phi=20]
  - alg: dadaquant
    label: dadaquant-phi40
    variant: phi40
    overrides: [algorithm.phi=40]

  - alg: feddistill
    label: feddistill-alpha1.0-ref
    variant: a1p0
    overrides: [algorithm.reg_alpha=1.0]
  - alg: feddistill
    label: feddistill-alpha0.1
    variant: a0p1
    overrides: [algorithm.reg_alpha=0.1]
  - alg: feddistill
    label: feddistill-alpha0.5
    variant: a0p5
    overrides: [algorithm.reg_alpha=0.5]
  - alg: feddistill
    label: feddistill-alpha2.0
    variant: a2p0
    overrides: [algorithm.reg_alpha=2.0]
  - alg: feddistill
    label: feddistill-alpha4.0
    variant: a4p0
    overrides: [algorithm.reg_alpha=4.0]

  - alg: fedkd
    label: fedkd-tmax0.95-ref
    variant: t0p95
    overrides: [algorithm.tmax=0.95]
  - alg: fedkd
    label: fedkd-tmax0.75
    variant: t0p75
    overrides: [algorithm.tmax=0.75]
  - alg: fedkd
    label: fedkd-tmax0.85
    variant: t0p85
    overrides: [algorithm.tmax=0.85]
  - alg: fedkd
    label: fedkd-tmax0.99
    variant: t0p99
    overrides: [algorithm.tmax=0.99]
  - alg: fedkd
    label: fedkd-tmax1.0
    variant: t1p0
    overrides: [algorithm.tmax=1.0]

  - alg: fedmaq
    label: fedmaq-qmax16-ref
    variant: qmax16
    overrides:
      - algorithm.q_max=16
      - algorithm.post_process=true
  - alg: fedmaq
    label: fedmaq-qmax4
    variant: qmax4
    overrides:
      - algorithm.q_max=4
      - algorithm.post_process=true
  - alg: fedmaq
    label: fedmaq-qmax6
    variant: qmax6
    overrides:
      - algorithm.q_max=6
      - algorithm.post_process=true
  - alg: fedmaq
    label: fedmaq-qmax8
    variant: qmax8
    overrides:
      - algorithm.q_max=8
      - algorithm.post_process=true
