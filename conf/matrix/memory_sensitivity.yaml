# Memory sensitivity matrix: sweeps c_unit in {512, 2048} (12 net-new cells).
# The c_unit=1024 cells are the standard benchmark grid FedMAQ runs, joined in analysis.
phase: formal
stage: downstream
protocol_stage: downstream
split: test
ledger: scientific
experiment_group: memory_sensitivity
dataset: cifar10
model: mobilenetv2
total_rounds: 100
client_gpus: 0.5
seeds: [0, 42, 123]
heterogeneities:
  - dirichlet_alpha_0.1
  - dirichlet_alpha_1.0

runs:
  - alg: fedmaq
    label: memory-sensitivity-cunit-512
    variant: cunit512
    overrides:
      - algorithm.c_unit=512.0
      - algorithm.post_process=true
  - alg: fedmaq
    label: memory-sensitivity-cunit-2048
    variant: cunit2048
    overrides:
      - algorithm.c_unit=2048.0
      - algorithm.post_process=true

