# Memory sensitivity matrix: sweeps c_unit in {256, 1024} (12 net-new cells).
# The c_unit=512 cells are the standard benchmark grid FedMAQ runs, joined in analysis.
phase: explore
experiment_group: memory_sensitivity
dataset: cifar10
model: mobilenetv2
total_rounds: 100
client_gpus: 0.5
seeds: [0, 42, 123]
heterogeneities:
  - dirichlet_alpha_0.1
  - dirichlet_alpha_1.0

runs:
  - alg: fedmaq
    label: memory-sensitivity-cunit-256
    variant: cunit256
    overrides:
      - algorithm.c_unit=256.0
      - algorithm.post_process=true
  - alg: fedmaq
    label: memory-sensitivity-cunit-1024
    variant: cunit1024
    overrides:
      - algorithm.c_unit=1024.0
      - algorithm.post_process=true
