# Exploration-phase KEEP-OR-DROP factorial, manuscript §4.3.1.
#
# Stage 2 of 3. Screening (conf/matrix/pass2_explore.yaml) locates a promising
# region at R=50 on one seed; this file makes the actual keep-or-drop calls,
# which §4.3.1 requires be "decided at three seeds, under a fully crossed
# factorial over the candidate refinements in which every mechanism appears in
# both its active and inactive state".
#
# Fully crossed over the three disclosed mechanisms: 2^3 = 8 cells x 3 seeds =
# 24 runs. Held at the same held-out alpha = 0.3 as every other exploration run.
# These runs are NOT part of the 183-run confirmatory grid (§4.5).
#
# Each mechanism's own hyperparameters stay at the neutral point of its range
# (ema_decay 0.7, grad_norm_beta 0.7, entropy/precision weight 1.0) so the
# factorial isolates "does this help at all" from "how should it be tuned".
# §4.3.1 records the resulting limitation: a mechanism inert at its neutral
# setting but valuable when tuned is discarded before the grid sees it.
#
# The (false, false, false) cell is the unrefined reference. Its seed-to-seed
# spread IS the sigma that scripts/analysis.py:exploration_noise_margin measures,
# and every delta below is judged against sqrt(2)*sigma, not against sigma.
#
# WHY THE REFERENCE CELL RUNS FIVE SEEDS AND THE OTHER SEVEN RUN THREE
#
# sigma is estimated from the reference cell alone, so that one cell's seed count
# sets the precision of the threshold every other cell is judged against. At n=3
# the 95% interval for sigma spans roughly [0.52s, 6.3s] -- a twelvefold range --
# which would make "measured rather than asserted" true only in the narrowest
# sense. At n=5 it narrows to about [0.60s, 2.87s]. Two extra runs (~35 min at
# R=50) buy that; deepening all eight cells would cost sixteen.
#
# MULTIPLICITY, AND WHY THERE IS NO ALPHA CORRECTION
#
# Seven non-reference cells are each compared against the same reference at the
# same threshold, and sqrt(2)*sigma corrects only for a delta carrying two runs'
# variance -- not for testing seven times. With n_ref=5 and n_cell=3 the delta's
# standard error is sigma*sqrt(1/5+1/3) = 0.73*sigma, so the threshold sits at
# about 1.94 SE: a per-comparison false-positive rate near 2.6%, and a
# family-wise rate near 17% across the seven. That is not negligible and is not
# corrected away here on purpose.
#
# It is controlled by design instead: this stage SELECTS, and
# conf/matrix/pass3_freeze_confirm.yaml CONFIRMS the selected cell on fresh runs
# at the full R=100 budget. A cell that clears here by chance must clear again
# independently, putting the joint rate below 1%. An alpha correction applied
# here would instead trade that for a loss of power the confirmation stage
# already covers. scripts/analysis.py emits these rates from the realized sigma
# and seed counts rather than restating the figures above.
#
# All eight cell means are reported, not only the surviving one. Reporting the
# winner alone is what would make the seven comparisons unauditable.
phase: explore
experiment_group: pass2_factorial
dataset: cifar10
model: mobilenetv2
total_rounds: 50
client_gpus: 0.5
seeds: [0, 42, 123]
heterogeneities:
  - dirichlet_alpha_0.3

runs:
  - alg: fedmaq
    label: sv0-ema0-gne0   # unrefined reference; defines sigma
    # Deepened to five seeds -- see "WHY THE REFERENCE CELL RUNS FIVE SEEDS"
    # above. This list must stay a superset of the matrix-level seeds.
    seeds: [0, 42, 123, 7, 21]
    overrides:
      - algorithm.soft_voting=false
      - algorithm.ema_student=false
      - algorithm.grad_norm_ema=false
  - alg: fedmaq
    label: sv1-ema0-gne0
    overrides:
      - algorithm.soft_voting=true
      - algorithm.ema_student=false
      - algorithm.grad_norm_ema=false
  - alg: fedmaq
    label: sv0-ema1-gne0
    overrides:
      - algorithm.soft_voting=false
      - algorithm.ema_student=true
      - algorithm.grad_norm_ema=false
  - alg: fedmaq
    label: sv0-ema0-gne1
    overrides:
      - algorithm.soft_voting=false
      - algorithm.ema_student=false
      - algorithm.grad_norm_ema=true
  - alg: fedmaq
    label: sv1-ema1-gne0
    overrides:
      - algorithm.soft_voting=true
      - algorithm.ema_student=true
      - algorithm.grad_norm_ema=false
  - alg: fedmaq
    label: sv1-ema0-gne1
    overrides:
      - algorithm.soft_voting=true
      - algorithm.ema_student=false
      - algorithm.grad_norm_ema=true
  - alg: fedmaq
    label: sv0-ema1-gne1
    overrides:
      - algorithm.soft_voting=false
      - algorithm.ema_student=true
      - algorithm.grad_norm_ema=true
  - alg: fedmaq
    label: sv1-ema1-gne1
    overrides:
      - algorithm.soft_voting=true
      - algorithm.ema_student=true
      - algorithm.grad_norm_ema=true
