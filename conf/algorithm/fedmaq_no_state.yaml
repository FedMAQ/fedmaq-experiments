# Ablation Configuration 4 (manuscript §4.3.7): FedMAQ minus state awareness.
#
# THIS IS THE FALLBACK ARM. Formulation 3 makes the gradient norm a multiplicative
# primary term carrying no weight of its own, so it cannot express the removal of
# state awareness at any parameter setting. Per the pre-registered rule in §4.3.7,
# this arm therefore runs on the nearest formulation that CAN express the removal
# (Formulation 1, gamma1 = 0) and is compared against the Formulation 1
# full-FedMAQ runs from the formulation study, NOT against Configuration 7.
#
# If Formulation 1 or 2 wins the formulation study, this arm becomes nested like
# every other: drop the `formulation` override below and the parity anchor
# reverts to Configuration 7.
#
# INHERITS full FedMAQ and states only its removal, so the frozen refinement
# layer reaches this arm from one place and no second difference is expressible.
# For what it composes to, see docs/freeze/ or `scripts/dump_frozen_configs.py`.
# Usage: uv run python scripts/run.py algorithm=fedmaq_no_state
defaults:
  - fedmaq
  - _self_

formulation: 1             # fallback formulation, see header
gamma1: 0.0                # <-- the removal defining this arm
gamma2: 1.0                # renormalized so the surviving data term carries full weight
