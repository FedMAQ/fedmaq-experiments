# Ablation Configuration 4 (manuscript §4.3.7): FedMAQ minus state awareness.
#
# The frozen power-mean formulation removes state awareness exactly at omega=0,
# which retains only data richness. gamma1=0 is retained solely so the archived
# historical Formulation 2 contrast remains reconstructable; it is inert under
# the selected formulation and is not an additional downstream removal.

#
# INHERITS full FedMAQ and states only its removal, so the frozen refinement
# layer reaches this arm from one place and no second difference is expressible.
# For what it composes to, see docs/freeze/ or `scripts/dump_frozen_configs.py`.
# Usage: uv run python scripts/run.py algorithm=fedmaq_no_state
defaults:
  - fedmaq
  - _self_

gamma1: 0.0                # Historical Formulation 2 reconstruction only; inert for power_mean
omega: 0.0                 # Selected power-mean removal: retains data, removes state

