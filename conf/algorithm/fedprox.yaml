# published best is 1. Manuscript §4.3.2, Table 4.1.
# Formerly: mu: 1.0 (published value for image datasets)
# Revised: mu updated to 0.01 following Stage 1b baseline_tuning (cleared noise margin by +2.67pp on MobileNetV2GN).
mu: 0.01

