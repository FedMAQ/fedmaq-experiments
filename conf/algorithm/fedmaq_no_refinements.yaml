# Ablation Configuration 8 (manuscript §4.3.7): full FedMAQ minus the frozen
# refinement layer. Removes no awareness signal; its contrast against
# Configuration 7 prices, on the confirmatory grid, the mechanism set that the
# exploration phase selected at the held-out alpha = 0.3 (§4.3.1).
# Leave-one-out: identical to fedmaq.yaml except the three refinement flags.
# Usage: uv run python scripts/run.py algorithm=fedmaq_no_refinements
name: fedmaq
q_min: 1
q_max: 16
bit_widths: [1, 2, 3, 4, 5, 6, 7, 8, 16, 32]
c_unit: 512.0

resource_aware: true

formulation: 3
gamma1: 0.5
gamma2: 0.5
lambda_val: 1.0
tau_g: 0.5
tau_n: 0.5

temperature: 1.0
kd_epochs: 1
server_kd_lr: 0.01
server_kd_momentum: 0.9
server_compute_speed: 5000.0

post_process: false

# --- The removal defining this arm: refinement layer off ---
soft_voting: false
entropy_weight: 1.0
precision_weight: 1.0
ema_student: false
ema_decay: 0.7
grad_norm_ema: false
grad_norm_beta: 0.7
client_kd_reg: false
kd_reg_alpha: 0.5
kd_reg_temp: 2.0
kd_prox_mu: 0.0
