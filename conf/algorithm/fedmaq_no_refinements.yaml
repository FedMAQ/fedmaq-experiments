# Ablation Configuration 8 (manuscript §4.3.7): full FedMAQ minus the frozen
# refinement layer. Removes no awareness signal; its contrast against
# Configuration 7 prices, on the confirmatory grid, the mechanism set that the
# exploration phase selected at the held-out alpha = 0.3 (§4.3.1).
#
# INHERITS full FedMAQ, then turns the whole refinement roster off. Unlike the
# other arms this one names all three flags rather than one, because "every
# refinement off" IS its definition, not a hand-copy of the freeze: whatever
# subset fedmaq.yaml ends up frozen on, this arm removes exactly that subset and
# nothing besides. If the freeze returns the EMPTY set, this arm collapses into a
# duplicate of Configuration 7 and drops from the study -- pre-registered in
# conf/matrix/pass3_freeze_confirm.yaml and enforced by
# tests/test_simulation.py::test_configuration_8_exists_only_while_there_is_a_layer_to_remove.
# For what it composes to, see docs/freeze/ or `scripts/dump_frozen_configs.py`.
# Usage: uv run python scripts/run.py algorithm=fedmaq_no_refinements
defaults:
  - fedmaq
  - _self_

# --- The removal defining this arm: refinement layer off ---
soft_voting: false
ema_student: false
grad_norm_ema: false
