# Ablation Configuration 3 (manuscript §4.3.7): FedMAQ minus data awareness.
# The DynFed-style reference point: gradient-norm-adaptive quantization under the
# Tier-1 memory ceiling with server-side KD, and no data-richness signal.
# Leave-one-out: under Formulation 3 the data term is the modulator
# (1 + kappa*n~)/(1 + kappa), so kappa = 0 removes it exactly and leaves
# q_hat = q_min + (q_max - q_min) * g~. Same formulation as full FedMAQ.
# If Formulation 1 or 2 wins the formulation study instead, set gamma2 = 0.
# Usage: uv run python scripts/run.py algorithm=fedmaq_no_data
name: fedmaq
q_min: 1
q_max: 16
bit_widths: [1, 2, 3, 4, 5, 6, 7, 8, 16, 32]
c_unit: 512.0

resource_aware: true

formulation: 3
gamma1: 0.5
gamma2: 0.5
lambda_val: 0.0            # <-- the single removal defining this arm
tau_g: 0.5
tau_n: 0.5

# Server-side KD retained, identical to full FedMAQ.
temperature: 1.0
kd_epochs: 1
server_kd_lr: 0.01
server_kd_momentum: 0.9
server_compute_speed: 5000.0

post_process: false

# Refinement layer held identical across every arm (§4.3.7 parity requirement).
soft_voting: true
entropy_weight: 1.0
precision_weight: 1.0
ema_student: true
ema_decay: 0.7
grad_norm_ema: true
grad_norm_beta: 0.7
client_kd_reg: false
kd_reg_alpha: 0.5
kd_reg_temp: 2.0
kd_prox_mu: 0.0
