# Ablation Configuration 3 (manuscript §4.3.7): FedMAQ minus data awareness.
# The DynFed-style reference point: gradient-norm-adaptive quantization under the
# Tier-1 memory ceiling with server-side KD, and no data-richness signal.
#
# Under the frozen Formulation 2 the soft target is (g~^gamma1)*(n~^gamma2), so
# gamma2 = 0 sends the data term to n~^0 = 1 and leaves
# q_hat = q_min + (q_max - q_min)*g~^gamma1. Across both Formulation 2 (gamma2=0)
# and the power-mean family (omega=1, ADR-0021 D4), the removal is exact.

#
# NO RENORMALIZATION, and that is the point. Under Formulation 1 this same removal
# leaves gamma1*g~ capped at 0.5, so the surviving signal cannot reach q_max and
# gamma1 has to be lifted to 1.0 to compensate -- a second difference forced by the
# linear form. Multiplicatively, g~^0.5 still spans [0, 1]; lifting gamma1 would
# alter only the response curvature, adding a difference the ablation would then
# have to attribute. See conf/algorithm/fedmaq_no_state.yaml, which under this
# freeze is this file's mirror image rather than a special case.
#
# INHERITS full FedMAQ and states only its removal, so the frozen refinement
# layer reaches this arm from one place and no second difference is expressible.
# For what it composes to, see docs/freeze/ or `scripts/dump_frozen_configs.py`.
# Usage: uv run python scripts/run.py algorithm=fedmaq_no_data
defaults:
  - fedmaq
  - _self_

gamma2: 0.0                # <-- Formulation 2 removal: n~^0 = 1 (removes data signal)
omega: 1.0                 # <-- Power-mean removal (ADR-0021 D4): weights state signal, removes data signal

