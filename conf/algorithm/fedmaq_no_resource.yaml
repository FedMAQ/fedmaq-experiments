# Ablation Configuration 2 (manuscript §4.3.7): FedMAQ minus resource awareness.
# Tier-1 memory ceiling lifted; the Tier-2 soft quality target alone governs q.
# Places FedMAQ in the memory-blind condition the reproducible baselines occupy,
# so the gap against Configuration 7 prices that blindness on one algorithm.
#
# INHERITS full FedMAQ and states only its removal. §4.3.7's leave-one-out
# property is therefore structural rather than checked after the fact: this file
# cannot express a second difference, and the frozen refinement layer reaches
# every arm from one place. For what it composes to, see the generated snapshot
# under docs/freeze/ or run `scripts/dump_frozen_configs.py`.
# Usage: uv run python scripts/run.py algorithm=fedmaq_no_resource
defaults:
  - fedmaq
  - _self_

resource_aware: false      # <-- the single removal defining this arm
                           # (c_unit is inherited but unused while this is false)
