# Ablation Configuration 2 (manuscript §4.3.7): FedMAQ minus resource awareness.
# Tier-1 memory ceiling lifted; the Tier-2 soft quality target alone governs q.
# Places FedMAQ in the memory-blind condition the reproducible baselines occupy,
# so the gap against Configuration 7 prices that blindness on one algorithm.
# Leave-one-out: identical to fedmaq.yaml except for `resource_aware`.
# Usage: uv run python scripts/run.py algorithm=fedmaq_no_resource
name: fedmaq
q_min: 1
q_max: 16
bit_widths: [1, 2, 3, 4, 5, 6, 7, 8, 16, 32]
c_unit: 512.0  # retained for schema parity; unused while resource_aware is false

resource_aware: false      # <-- the single removal defining this arm

# Combination logic held identical to full FedMAQ (formulation-study winner).
formulation: 3
gamma1: 0.5
gamma2: 0.5
lambda_val: 1.0
tau_g: 0.5
tau_n: 0.5

# Server-side KD retained, identical to full FedMAQ.
temperature: 1.0
kd_epochs: 1
server_kd_lr: 0.01
server_kd_momentum: 0.9
server_compute_speed: 5000.0

post_process: false

# Refinement layer held identical across every arm (§4.3.7 parity requirement).
soft_voting: true
entropy_weight: 1.0
precision_weight: 1.0
ema_student: true
ema_decay: 0.7
grad_norm_ema: true
grad_norm_beta: 0.7
client_kd_reg: false
kd_reg_alpha: 0.5
kd_reg_temp: 2.0
kd_prox_mu: 0.0
