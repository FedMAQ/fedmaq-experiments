# Ablation Configuration 5 (manuscript §4.3.7): FedMAQ minus knowledge distillation.
# Multi-adaptive quantization retained in full; server-side KD removed
# (kd_epochs=0 skips the distillation loop entirely). Isolates the accuracy that
# distillation recovers from quantization noise. Paired with Configuration 7 to
# test the falsifiable prediction that KD's benefit grows with skew.
#
# INHERITS full FedMAQ and states only its removals, so the frozen refinement
# layer reaches this arm from one place and no third difference is expressible.
# For what it composes to, see docs/freeze/ or `scripts/dump_frozen_configs.py`.
# Usage: uv run python scripts/run.py algorithm=fedmaq_no_kd
defaults:
  - fedmaq
  - _self_

kd_epochs: 0              # <-- the single removal defining this arm

# soft_voting is recorded as INAPPLICABLE here rather than silently disabled: it
# weights teacher logits during distillation, and this arm performs none. It
# registers as a *difference* from Configuration 7 only if the freeze turned it
# on. ema_student and grad_norm_ema act outside distillation and stay inherited.
soft_voting: false        # INAPPLICABLE (no distillation to weight)
