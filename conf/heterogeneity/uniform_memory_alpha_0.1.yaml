# Uniform-memory control arm at severe data skew (§4.1, §4.3).
#
# Same 8192 MB capacity for every client. At c_unit=512 that is a Tier-1 ceiling
# of 16, equal to fedmaq.yaml's q_max, so the ceiling never binds and this is the
# memory-blind condition; the arm's contrast against FedMAQ's variable-memory
# rows prices the memory ceiling, NOT server-side KD (Decision 75 -- KD is on and
# identically configured on both sides). Split from uniform_memory.yaml into
# per-alpha files because the run harness keys output directories on the
# heterogeneity config name; a single file overridden twice would have written
# both alphas to the same directory.
#
# Dispatch via conf/matrix/uniform_memory_control.yaml, which also sets the
# post-processing flag this arm needs for parity with its comparison partner.
partition: dirichlet
alpha: 0.1
uniform_memory_mb: 8192
