defaults:
  - dataset: cifar10
  - heterogeneity: dirichlet_alpha_0.1
  - algorithm: fedavg
  - experiment: default
  - _self_

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Default single-run seed. For statistical controls (§4.3), run with 3 seeds:
#   uv run python scripts/run.py --multirun seed=0,42,123
# Canonical seeds: [0, 42, 123]
#
# Full benchmark sweep (CIFAR-10 / CIFAR-100, two alpha values, 3 seeds):
#   uv run python scripts/run.py --multirun \
#     dataset=cifar10,cifar100 heterogeneity=dirichlet_alpha_0.1,dirichlet_alpha_1.0 \
#     algorithm=fedavg,fedprox,fedpaq,dadaquant,fedkd,fedmaq,feddistill \
#     seed=0,42,123
#
# FEMNIST sweep (writer partition, 3 seeds):
#   uv run python scripts/run.py --multirun \
#     dataset=femnist heterogeneity=femnist experiment=femnist \
#     algorithm=fedavg,fedprox,fedpaq,dadaquant,fedkd,fedmaq,feddistill \
#     seed=0,42,123
#
# fedmd and cfd are deliberately absent from both sweeps above: DECISIONS #25/#26
# dropped them from the formal stack and manuscript §4.3.2 documents the
# exclusions (fedmd's per-client transfer-learning pretrain does not scale to
# K=100; cfd's 1-bit hard vote collapses to chance at this client scale). Their
# configs are retained for reproducibility of that finding, not for the grid.
#
# Formulation study (§4.3.6): CIFAR-10, both alpha regimes, variable memory, all
# 5 formulations (0-4), 30 runs. Dispatch it through its matrix file:
#   uv run python scripts/run_matrix.py --matrix formulation_study
#
# It was a raw --multirun here until 2026-07-26. That put its runs in a date-keyed
# multirun/ tree with no experiment_group, which matters because the Formulation 1
# cell is the parity anchor for Ablation Configuration 4 under the §4.3.7 fallback
# rule (see fedmaq_no_state.yaml), and scripts/analysis.py has to be able to find
# it. Each run carries a `variant` because the canonical output path keys on the
# algorithm config, not the run label, and all five are algorithm=fedmaq.
#
# Ablation study (§4.3.7), 7 net-new leave-one-out arms, both alpha, 3 seeds.
# Dispatch it through its matrix file, which carries the regime constraints:
#   uv run python scripts/run_matrix.py --matrix ablation
#
# Only Configuration 1 (uncompressed FedAvg) is inherited from the main grid.
# Configuration 7 is NOT: the main grid runs FedMAQ with the post-processing
# pipeline and no ablation arm does, so inheriting it would make every arm two
# removals from its own reference. See conf/matrix/ablation.yaml.
#
# Exploration phase (§4.3.1) runs at the held-out alpha=0.3 and is NOT part of
# the confirmatory grid — see conf/matrix/pass2_explore.yaml.
#
# ``algorithm.post_process`` (§4.3) gates FedMAQ's error-feedback/diff-coding/zlib
# pipeline on top of quantization. It ships false in every conf/algorithm file and
# is turned on per-grid instead: conf/matrix/benchmark_grid.yaml overrides it to
# true for FedMAQ, and the FEMNIST sweep above must do the same when it runs.
# The formulation study and every ablation arm stay pipeline-free by design --
# see the headers of fedmaq.yaml and conf/matrix/ablation.yaml before changing
# this. Both directions are enforced in tests/test_simulation.py.
seed: 42
