defaults:
  - dataset: cifar10
  - heterogeneity: dirichlet_alpha_0.1
  - algorithm: fedavg
  - experiment: default
  - _self_

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}

# Default single-run seed. For statistical controls (§4.3), run with 3 seeds:
#   uv run python scripts/run.py --multirun seed=0,42,123
# Canonical seeds: [0, 42, 123]
#
# EVERY CONFIRMATORY RUN IS DISPATCHED THROUGH A MATRIX FILE. Do not hand-type a
# --multirun for any of them. The 183 runs of §4.5:
#
#   uv run python scripts/run_matrix.py --matrix benchmark_grid           # 42
#   uv run python scripts/run_matrix.py --matrix benchmark_grid_cifar100  # 42
#   uv run python scripts/run_matrix.py --matrix benchmark_grid_femnist   # 21
#   uv run python scripts/run_matrix.py --matrix formulation_study        # 30
#   uv run python scripts/run_matrix.py --matrix ablation                 # 42
#   uv run python scripts/run_matrix.py --matrix uniform_memory_control   #  6
#
# The three benchmark_grid* files share one `experiment_group`, so analysis.py
# reads them as the single 105-run primary grid the manuscript describes.
#
# The primary grid was a hand-typed --multirun here until 2026-07-30, for the
# same reason the formulation study was until 2026-07-26, and it failed the same
# two ways plus a third. It landed in a date-keyed multirun/ tree with no
# experiment_group; it silently omitted `algorithm.post_process=true` on FedMAQ
# while conf/matrix/benchmark_grid.yaml set it, so the CIFAR-100 and FEMNIST rows
# of one communication table would have been measured in a different regime from
# the CIFAR-10 rows; and nothing tested it, because tests read conf/matrix/ and a
# comment is not a matrix. tests/test_simulation.py now asserts all three files
# carry the flag and that they sum to 105.
#
# ORDERING IS LOAD-BEARING (§4.5). The exploration phase (pass2_explore ->
# pass2_factorial -> pass3_freeze_confirm) completes and freezes first; the
# formulation study runs next, carrying the surviving refinement layer, because
# its Formulation 1 cell is Ablation Configuration 4's parity anchor; the
# ablation runs after that, since its arms are pinned to the winning formulation.
# The three benchmark_grid* files are independent of that chain only for the six
# baselines; FedMAQ's own rows need the freeze.
#
# fedmd and cfd are deliberately absent from every grid: DECISIONS #25/#26
# dropped them from the formal stack and manuscript §4.3.2 documents the
# exclusions (fedmd's per-client transfer-learning pretrain does not scale to
# K=100; cfd's 1-bit hard vote collapses to chance at this client scale). Their
# configs are retained for reproducibility of that finding, not for the grid.
#
# Formulation study (§4.3.6): CIFAR-10, both alpha regimes, variable memory, all
# 5 formulations (0-4), 30 runs. Dispatch it through its matrix file:
#   uv run python scripts/run_matrix.py --matrix formulation_study
#
# It was a raw --multirun here until 2026-07-26. That put its runs in a date-keyed
# multirun/ tree with no experiment_group, which matters because the Formulation 1
# cell is the parity anchor for Ablation Configuration 4 under the §4.3.7 fallback
# rule (see fedmaq_no_state.yaml), and scripts/analysis.py has to be able to find
# it. Each run carries a `variant` because the canonical output path keys on the
# algorithm config, not the run label, and all five are algorithm=fedmaq.
#
# Ablation study (§4.3.7), 7 net-new leave-one-out arms, both alpha, 3 seeds.
# Dispatch it through its matrix file, which carries the regime constraints:
#   uv run python scripts/run_matrix.py --matrix ablation
#
# Only Configuration 1 (uncompressed FedAvg) is inherited from the main grid.
# Configuration 7 is NOT: the main grid runs FedMAQ with the post-processing
# pipeline and no ablation arm does, so inheriting it would make every arm two
# removals from its own reference. See conf/matrix/ablation.yaml.
#
# Exploration phase (§4.3.1) runs at the held-out alpha=0.3 and is NOT part of
# the confirmatory grid — see conf/matrix/pass2_explore.yaml.
#
# ``algorithm.post_process`` (§4.3) gates FedMAQ's error-feedback/diff-coding/zlib
# pipeline on top of quantization. It ships false in every conf/algorithm file and
# is turned on per-grid instead. The rule that decides it is always the same:
# match the regime of whatever the run is compared against.
#
#   ON  — all three benchmark_grid* files, and uniform_memory_control.yaml,
#         whose partner is FedMAQ's own primary-grid rows.
#   OFF — formulation_study.yaml and every ablation.yaml arm, so no arm is two
#         removals from its reference.
#
# See the headers of fedmaq.yaml and conf/matrix/ablation.yaml before changing
# this. Both directions are enforced in tests/test_simulation.py.
seed: 42

# Ray runtime settings, forwarded to ray.init() through Flower's
# ``backend_config["init_args"]`` (see fedmaq.simulation).
#
# These are properties of the execution host, not of the experiment, which is why
# they sit here rather than under conf/experiment/: that group is replaced wholesale
# by ``experiment=femnist``, so a key placed there has to be copied into all four
# files and is silently lost by the fifth.
#
# Both default to null, reproducing Flower's stock ray.init() exactly. Set them on
# the host that needs them:
#
#   object_store_gb  Ray sizes its object store at ~30% of *total* RAM. On the
#                    datacenter allocation that is ~19 GB of a 64 GB machine with
#                    only ~28 GB actually available, and .claude/rules/
#                    flower-patterns.md records that low system RAM starves
#                    Ray/PyTorch init independently of VRAM. 4 is ample: the store
#                    carries parameter payloads between actors, and MobileNetV2GN is
#                    ~27 MB of weights.
#   temp_dir         Ray's session directory defaults to /tmp/ray. The allocation is
#                    one shared VM with per-user Unix accounts and a shared /tmp, so
#                    a co-tenant's session collides with ours there. Use a short
#                    per-user path such as /tmp/ray-cjb. Short, not under $HOME:
#                    Ray builds Unix domain sockets beneath this directory and those
#                    paths cap near 107 characters.
ray:
  object_store_gb: null
  temp_dir: null
