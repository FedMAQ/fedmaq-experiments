# General experimental hyperparameters (aligned with chapter_4.tex Table 4.1)
# For preliminary iterative runs, use: experiment=preliminary  (K=50, R=10)
# For fast CI / testing runs, use: +experiment=ci  (R=2, K=2)
num_clients: 100
batch_size: 64            # B
local_epochs: 5           # E
learning_rate: 0.01       # eta (base learning rate)
learning_rate_decay: 0.99 # gamma (per-round exponential decay factor)
weight_decay: 0.0001      # lambda (SGD weight decay, 10^-4)
momentum: 0.9             # beta (SGD momentum, aligned with FL literature)
client_fraction: 0.1      # C (10% per round)
total_rounds: 100         # R per manuscript §4.3, Table 4.1
num_public_samples: 3000  # |D_pub| per manuscript §4.3, Table 4.1
client_gpus: 1.0          # GPU resource fraction allocated per client simulator

# Reproducibility: when true, non-deterministic CUDA/torch ops raise instead of
# silently degrading run-to-run reproducibility (see simulation.set_seed). Flip
# off only to diagnose an op that lacks a deterministic kernel.
strict_determinism: true

# Bandwidth and Compute settings (uniform, grounded in ADR-0002 Late-2023 specs)
bandwidth_mbps: 10.0
compute_samples_per_sec: 20.0  # Raspberry Pi 5 Quad Cortex-A76 @ 2.4GHz sustained (~57% of 31.5 GFLOPS peak) for MobileNetV2GN (ADR-0002)


# Telemetry settings
#
# Online so the 183-run grid is watchable while it runs on the datacenter
# allocation, where the alternative is reading a tee'd log over the JupyterHub
# terminal. WandB is strictly a viewing surface: every reported result is
# computed from this run's local ``experiment_log.csv``, and ``telemetry.log``
# writes those local logs before it touches WandB and swallows WandB failures,
# so losing the network mid-sweep costs visibility and nothing else.
#
# Authenticate with ``export WANDB_API_KEY=...`` on the host -- never commit a
# key. ``WANDB_MODE=offline`` overrides ``mode`` below without a config edit,
# which is the escape hatch if the host blocks egress or the key is absent.
telemetry:
  wandb_enabled: true
  project: "fedmaq-experiments"
  mode: "online"         # "online" or "offline"; WANDB_MODE env var overrides
  run_name: null

# Local model checkpoint persistence for distillation baseline (e.g. FedMD)
persistence_dir: ".data_partitions/fedmd_models"
