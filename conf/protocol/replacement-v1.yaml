# Versioned authority for the replacement pipeline.  Selection stages consume
# validation data only; assurance jobs are never scientific cells.
schema_version: 1
name: replacement-v1
stages:
  matched_tuning:
    selection_data: validation_only
    reserved_test: true
    split: val
  stage_1a:
    selection_data: validation_only
    reserved_test: true
    split: val
  stage_1b:
    selection_data: validation_only
    reserved_test: true
    split: val
  downstream:
    selection_data: frozen_validation_verdicts
    reserved_test: true
    split: test
  assurance:
    selection_data: none
    reserved_test: false
    split: none
  # FedMAQ-v2 confirmation (ADR-0016, 2026-09-25). Consumes the first study's
  # frozen validation verdicts and selects nothing, so it reads test like downstream
  # but carries its own stage name, contract, and preregistration hash.
  v2_confirm:
    selection_data: frozen_validation_verdicts
    reserved_test: true
    split: test
  # FedKD smoke gate 2 (ADR-0028, item 6): the fixed FedKD on the three first-study
  # cells that went nonfinite. Selects nothing; its verdict is finite or not.
  v2_fedkd_preflight:
    selection_data: frozen_validation_verdicts
    reserved_test: true
    split: test
  # FedKD first-study rerun (ADR-0028, item 6): the fixed FedKD on the twelve other
  # first-study cells, after the preflight passes. Selects nothing; a post-hoc row.
  v2_fedkd_first_study:
    selection_data: frozen_validation_verdicts
    reserved_test: true
    split: test
  # KD-repair screen (ADR-0028, items 2-4): selects each family's entrant on
  # validation data, on the first-study seeds, before confirmation reads test.
  v2_kd_screen:
    selection_data: validation_only
    reserved_test: true
    split: val
  # KD-repair confirmation (ADR-0028, item 5): the screen's advanced repairs, fixed
  # FedKD, and any control reruns on the V2 seeds. Consumes the frozen screen verdicts
  # and selects nothing, so it reads test.
  v2_kd_confirm:
    selection_data: frozen_validation_verdicts
    reserved_test: true
    split: test
wire_protocol: packed_wire_v1
historical_artifacts_promotable: false

# Independent dispatch authority. These semantic fingerprints cover the complete
# resolved matrix, including treatment-defining overrides; regenerating a ledger
# from an edited matrix therefore cannot make the edit appear preregistered.
selection_domains:
  # Registered base for every scientific matrix. baseline_tuning_wide alone
  # extends it to [0, 42, 123, 7, 21], these three first, because matched tuning
  # budgets 29 arms x 5 seeds = 145 cells; scripts/stage_manifest.py enforces
  # that five-seed tuple for Stage A. v2_confirm replaces the base with fresh
  # seeds [19, 37, 73, 101, 131], pinned by its matrix hashes below; this list stays
  # unchanged because every stage's preregistration hash covers it.
  seeds: [0, 42, 123]
  # Bit-width histogram bins (q_count_b, q_hat_count_b), not a swept axis: no
  # matrix sweeps a key of this name, and the swept algorithm.q reaches 32,
  # which this list excludes.
  q_ladder: [2, 3, 4, 5, 6, 7, 8, 16]
  p_support: [-2, -1, -0.5, 0, 0.5, 1, min]
  omega_support: [0.25, 0.5, 0.75]
  adoption_margin: "delta > sqrt(2) * sigma(reference cell)"
  tie_rule: "neutral-first omega=0.5; otherwise larger delta"

matrix_contracts:
  baseline_tuning_wide: {stage: matched_tuning, split: val, ledger: scientific, rounds: 100, cell_count: 145, sha256: 41a4456817dd410f6685feabcce0e8600e36d1489d3bdf7c80e6a208b26603c0}
