name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    # The source certificate is dependency-free and catches scope escape before
    # the slower project checks run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture freeze certificate
        run: python scripts/check_freeze.py --check

  lint:
    # Fast, deterministic gate: ruff needs no project dependencies, so it runs via
    # `uvx` without the CUDA-pinned torch install. This is the blocking check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Ruff lint
        run: uvx ruff@0.15.19 check .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Ruff format
        run: uvx ruff@0.15.19 format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Mypy
        run: uvx mypy@1.13 src/fedmaq --ignore-missing-imports --python-version 3.11

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Verify generated certificates and manifests
        run: |
          uv run python scripts/dump_frozen_configs.py --check
          uv run python scripts/dump_expected_runs.py --check
          uv run python scripts/generate_schema_fixture.py --check
          uv run python scripts/stage_manifest.py --check
          uv run python scripts/stage_ledgers.py --check

  cpu-test:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: CPU pytest
        run: uv run python -m pytest

  assurance:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Deterministic analysis and transition fixture
        run: uv run python scripts/run_assurance_fixtures.py
